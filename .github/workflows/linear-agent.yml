name: Linear Agent

# Fired by the Vercel relay at api/linear-webhook.ts when a Linear issue
# is labelled and moved into the trigger state.
on:
  repository_dispatch:
    types: [linear-issue]
  # Manual escape hatch for testing without touching Linear.
  workflow_dispatch:
    inputs:
      identifier:
        description: Issue key, e.g. ENG-123
        required: true
      title:
        description: Issue title
        required: true
      description:
        description: Issue description
        required: false

concurrency:
  # One run per issue; a re-trigger supersedes an in-flight run.
  group: linear-agent-${{ github.event.client_payload.identifier || inputs.identifier }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required by claude-code-action: it exchanges a GitHub OIDC token
      # rather than sending your credential straight to the API.
      id-token: write
    steps:
      - name: Resolve issue fields
        id: issue
        run: |
          {
            echo "identifier=${{ github.event.client_payload.identifier || inputs.identifier }}"
            echo "branch=${{ github.event.client_payload.branchName || format('agent/{0}', inputs.identifier) }}"
            echo "url=${{ github.event.client_payload.url }}"
          } >> "$GITHUB_OUTPUT"
          {
            echo 'title<<TITLE_EOF'
            echo "${{ github.event.client_payload.title || inputs.title }}"
            echo 'TITLE_EOF'
            echo 'description<<DESC_EOF'
            echo "${{ github.event.client_payload.description || inputs.description }}"
            echo 'DESC_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action tries to mint a GitHub App token via OIDC
          # exchange, which fails outside the Claude GitHub App install.
          github_token: ${{ secrets.AGENT_PAT }}
          claude_args: '--allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run lint),Bash(npx tsc -b),Bash(npm run build)" --max-turns 40'
          prompt: |
            Implement the following Linear issue in this repository.

            Issue: ${{ steps.issue.outputs.identifier }}
            Title: ${{ steps.issue.outputs.title }}

            Description:
            ${{ steps.issue.outputs.description }}

            Rules:
            - Follow the conventions in CLAUDE.md.
            - Make the change directly in the working tree. Do NOT commit, push,
              or open a pull request — a later step handles that.
            - Before finishing, run `npx tsc -b` and `npm run lint` and fix
              anything you broke.
            - Keep the change scoped to what the issue asks for.
            - If the issue is too ambiguous to implement safely, make no changes
              and explain what is missing.

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (not GITHUB_TOKEN) so that opening the PR triggers CI —
          # without this the required checks never run and auto-merge stalls.
          token: ${{ secrets.AGENT_PAT }}
          base: dev
          branch: ${{ steps.issue.outputs.branch }}
          commit-message: "${{ steps.issue.outputs.identifier }}: ${{ steps.issue.outputs.title }}"
          title: "${{ steps.issue.outputs.identifier }}: ${{ steps.issue.outputs.title }}"
          body: |
            Automated implementation of [${{ steps.issue.outputs.identifier }}](${{ steps.issue.outputs.url }}).

            > Generated by Claude Code from a Linear issue. Review the diff before it reaches an environment that matters.
          labels: automated, linear-agent
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash

      - name: Report outcome
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "Opened PR #${{ steps.pr.outputs.pull-request-number }} for ${{ steps.issue.outputs.identifier }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changes produced for ${{ steps.issue.outputs.identifier }} — nothing to merge." >> "$GITHUB_STEP_SUMMARY"
          fi
